[project]
name = "wervelnieuws-backend"
version = "0.1.0"
description = "Backend API for wind park communication platform"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.7",
  "httpx==0.28.1",
  "openai==1.65.4",
  "openpyxl==3.1.5",
  "passlib==1.7.4",
  "pydantic-settings==2.7.1",
  "pypdf==5.2.0",
  "python-docx==1.1.2",
  "python-jose[cryptography]==3.3.0",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.37",
  "structlog==25.1.0",
  "tenacity==9.0.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "respx==0.22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
