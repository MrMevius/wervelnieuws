services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - .env
    # Loopback only: browsers reach the API through the frontend's /api proxy;
    # the host port is for local health checks and the deploy script.
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    volumes:
      - ${WERVEL_STORAGE_DIR:-/mnt/wervelwind/database}:/data
      - ${WERVEL_CONFIG_DIR:-/mnt/wervelwind/database/config}:/config
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: runtime
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ${WERVEL_STORAGE_DIR:-/mnt/wervelwind/database}:/data
      - ${WERVEL_CONFIG_DIR:-/mnt/wervelwind/database/config}:/config
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ${WERVEL_STORAGE_DIR:-/mnt/wervelwind/database}:/data
      - ${WERVEL_CONFIG_DIR:-/mnt/wervelwind/database/config}:/config
