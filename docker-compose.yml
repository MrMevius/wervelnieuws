services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ${WERVEL_STORAGE_DIR:-/mnt/wervelwind/database}:/data
      - ${WERVEL_CONFIG_DIR:-/mnt/wervelwind/database/config}:/config
    depends_on:
      - migrate

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    volumes:
      - ${WERVEL_STORAGE_DIR:-/mnt/wervelwind/database}:/data
      - ${WERVEL_CONFIG_DIR:-/mnt/wervelwind/database/config}:/config
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001/api}
    ports:
      - "5173:80"
    depends_on:
      - backend

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ${WERVEL_STORAGE_DIR:-/mnt/wervelwind/database}:/data
      - ${WERVEL_CONFIG_DIR:-/mnt/wervelwind/database/config}:/config
