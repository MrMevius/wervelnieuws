name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    uses: MrMevius/github-workflows/.github/workflows/reusable-python-ci.yml@v1
    with:
      python-version: "3.11"
      working-directory: backend
      cache-dependency-path: backend/pyproject.toml
      install-command: "pip install -e .[dev]"
      test-command: "pytest"

  frontend-tests-build:
    name: Frontend tests and build
    uses: MrMevius/github-workflows/.github/workflows/reusable-node-ci.yml@v1
    with:
      node-version: "20"
      working-directory: frontend
      cache-dependency-path: frontend/package-lock.json
      test-command: "npm test"
      build-command: "npm run build"
